spring.application.name=notification

logging.level.root=INFO

# APPROACH A: Specify a custom file name and path
logging.file.name=C://notification//logs//notification.log

# APPROACH B: Specify just the directory (creates "spring.log" inside it)
#logging.file.path=C://notification//logs

#spring.mvc.view.prefix=/WEB-INF/jsp/
#spring.mvc.view.suffix=.jsp

spring.mvc.view.prefix=/
spring.mvc.view.suffix=.html

# Disable default whitelabel error view forcing the container to use our error templates
server.error.whitelabel.enabled=false

# Set user name and password for authentication as part of security configuration
spring.security.user.name=test
spring.security.user.password=test
