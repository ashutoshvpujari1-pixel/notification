<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Employee - REST API</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #eaf4ff, #f7fbff);
            color: #1f2937;
            min-height: 100vh;
        }
        header {
            background: linear-gradient(90deg, #073b6f, #0b63a5);
            color: white;
            padding: 22px 40px;
            box-shadow: 0 3px 12px rgba(0,0,0,.15);
        }
        header h1 { margin: 0; font-size: 26px; }
        header p { margin: 6px 0 0; opacity: .85; }
        main {
            width: min(650px, calc(100% - 32px));
            margin: 55px auto;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 34px;
            box-shadow: 0 12px 35px rgba(18, 65, 105, .13);
        }
        .card h2 {
            margin: 0 0 8px;
            color: #073b6f;
        }
        .subtitle {
            margin: 0 0 28px;
            color: #64748b;
        }
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: .2s;
        }
        input:focus {
            border-color: #1976d2;
            box-shadow: 0 0 0 3px rgba(25,118,210,.12);
        }
        .api-box {
            background: #f1f7fc;
            border: 1px solid #d7e8f6;
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 24px;
            font-size: 13px;
            color: #334155;
            word-break: break-all;
        }
        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }
        button {
            flex: 1;
            padding: 13px 18px;
            border: 0;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }
        #saveButton { background: #1976d2; color: white; }
        #saveButton:hover { background: #125ea8; }
        #saveButton:disabled { background: #94a3b8; cursor: not-allowed; }
        #clearButton { background: #e2e8f0; color: #334155; }
        #clearButton:hover { background: #cbd5e1; }
        #message {
            display: none;
            margin-top: 22px;
            padding: 14px;
            border-radius: 8px;
            line-height: 1.5;
        }
        #message.success { display: block; background: #dcfce7; color: #166534; }
        #message.error { display: block; background: #fee2e2; color: #991b1b; }
        #response {
            display: none;
            margin-top: 16px;
            padding: 14px;
            background: #0f172a;
            color: #dbeafe;
            border-radius: 8px;
            white-space: pre-wrap;
            overflow-x: auto;
            font-family: Consolas, monospace;
            font-size: 13px;
        }
        footer {
            text-align: center;
            padding: 25px;
            color: #64748b;
            font-size: 13px;
        }
        @media (max-width: 520px) {
            .card { padding: 24px; }
            .buttons { flex-direction: column; }
        }
    </style>
</head>
<body>

<header>
    <h1>Employee Management System</h1>
    <p>Create Employee using REST API</p>
</header>

<main>
    <section class="card">
        <h2>Update Employee</h2>
        <p class="subtitle">Enter employee details and click Save to update Employee Details.</p>

        <div class="api-box">
            <strong>POST API:</strong>
            <span id="apiUrl"></span><br>
            <strong>Content-Type:</strong> application/json
        </div>

        <form id="employeeForm">
        	<div class="form-group">
                <label for="id">Employee Id</label>
                <input id="id" type="text" placeholder="Enter employee id" required>
            </div>
            
            <div class="form-group">
                <label for="name">Employee Name</label>
                <input id="name" type="text" placeholder="Enter employee name" required>
            </div>

            <div class="form-group">
                <label for="department">Department</label>
                <input id="department" type="text" placeholder="Enter department" required>
            </div>

            <div class="form-group">
                <label for="salary">Salary</label>
                <input id="salary" type="number" step="0.01" min="0"
                       placeholder="Enter salary" required>
            </div>

            <div class="buttons">
                <button id="saveButton" type="submit">Save Employee</button>
                <button id="clearButton" type="button">Clear</button>
            </div>
        </form>

        <div id="message"></div>
        <pre id="response"></pre>
    </section>
</main>

<footer>
    Employee REST API Client &nbsp;|&nbsp; HTML + JavaScript Fetch API
</footer>

<script>
    /*
     * CHANGE THIS URL if your REST API uses a different URL.
     */
    const API_URL = "http://localhost:8080/api/employees";

    const form = document.getElementById("employeeForm");
    const saveButton = document.getElementById("saveButton");
    const clearButton = document.getElementById("clearButton");
    const message = document.getElementById("message");
    const responseBox = document.getElementById("response");

    document.getElementById("apiUrl").textContent = API_URL;

    /*
     * SAVE BUTTON
     * Clicking Save invokes POST REST API.
     */
    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const id = document.getElementById("id").value.trim();
        const name = document.getElementById("name").value.trim();
        const department = document.getElementById("department").value.trim();
        const salary = Number(document.getElementById("salary").value);

        if (!id || !name || !department || Number.isNaN(salary)) {
            showMessage("Please enter all employee details.", "error");
            return;
        }

        /*
         * JSON object that will be sent to REST API.
         */
        const employee = {
        	id: id,
            name: name,
            department: department,
            salary: salary
        };

        console.log("JSON being sent:");
        console.log(JSON.stringify(employee, null, 2));

        saveButton.disabled = true;
        saveButton.textContent = "Saving...";
        message.className = "";
        message.style.display = "none";
        responseBox.style.display = "none";

        try {
            /*
             * POST REST API INVOCATION
             *
             * method  = POST
             * headers = Content-Type: application/json
             * body    = JSON employee object
             */
            const response = await fetch(API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify(employee)
            });

            /*
             * Read response. Some APIs return JSON;
             * this also handles an empty response body.
             */
            const responseText = await response.text();

            let responseData = responseText;
            try {
                responseData = responseText
                    ? JSON.parse(responseText)
                    : "";
            } catch (e) {
                // Response is not JSON; keep it as text.
            }

            if (!response.ok) {
                throw new Error(
                    "REST API returned HTTP " +
                    response.status + " " +
                    response.statusText +
                    (responseText ? " - " + responseText : "")
                );
            }

            showMessage("Employee saved successfully.", "success");

            if (responseData !== "") {
                responseBox.textContent =
                    "REST API Response:\\n\\n" +
                    (typeof responseData === "object"
                        ? JSON.stringify(responseData, null, 2)
                        : responseData);
                responseBox.style.display = "block";
            }

            form.reset();

        } catch (error) {
            console.error("POST API Error:", error);

            showMessage(
                "Unable to save employee. " + error.message,
                "error"
            );

        } finally {
            saveButton.disabled = false;
            saveButton.textContent = "Save Employee";
        }
    });

    clearButton.addEventListener("click", function () {
        form.reset();
        message.className = "";
        message.style.display = "none";
        responseBox.style.display = "none";
    });

    function showMessage(text, type) {
        message.textContent = text;
        message.className = type;
        message.style.display = "block";
    }
</script>

</body>
</html>
